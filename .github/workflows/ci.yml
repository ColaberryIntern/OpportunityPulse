name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test
  JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
  JWT_ACCESS_EXPIRY: 15m
  BCRYPT_ROUNDS: 10
  FRONTEND_URL: http://localhost:3002
  RATE_LIMIT_WINDOW_MS: 900000
  RATE_LIMIT_MAX_REQUESTS: 1000
  AUTH_RATE_LIMIT_MAX: 1000
  LOG_LEVEL: error
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

jobs:
  # Stage 1: Lint
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

  # Stage 2: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          ! grep -rn "password\s*=\s*['\"]" backend/src/ frontend/src/ --include="*.js" --include="*.jsx" || echo "Warning: potential hardcoded secrets found"

  # Stage 3: Governance checks
  governance:
    name: Governance Checks
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate environment config
        run: node execution/scripts/validate_env.js
        env:
          NODE_ENV: test
          PORT: 3001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opportunity_pulse_test
          DB_USER: opportunity_pulse
          DB_PASSWORD: ci_password
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
          BCRYPT_ROUNDS: 10

      - name: Run security scan
        run: node execution/scripts/validate_security.js

  # Stage 4: Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npx jest tests/unit --coverage --forceExit
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opportunity_pulse_test
          DB_USER: opportunity_pulse
          DB_PASSWORD: ci_password

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: backend/coverage/

  # Stage 5: Frontend tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # Stage 6: Integration tests (requires PostgreSQL)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: opportunity_pulse_test
          POSTGRES_USER: opportunity_pulse
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run integration tests
        working-directory: backend
        run: npx jest tests/integration --runInBand --forceExit
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opportunity_pulse_test
          DB_USER: opportunity_pulse
          DB_PASSWORD: ci_password

  # Stage 7: E2E tests (requires PostgreSQL)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: opportunity_pulse_test
          POSTGRES_USER: opportunity_pulse
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run E2E tests
        working-directory: backend
        run: npx jest tests/e2e --runInBand --forceExit
        env:
          PORT: 3090
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opportunity_pulse_test
          DB_USER: opportunity_pulse
          DB_PASSWORD: ci_password

  # Stage 8: Docker build verification
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [e2e-tests, governance]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t op-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t op-frontend:ci ./frontend

      - name: Verify images exist
        run: |
          docker image inspect op-backend:ci > /dev/null 2>&1
          docker image inspect op-frontend:ci > /dev/null 2>&1
          echo "Both images built successfully"

# Stage 9: DEPLOY REMOVED -- deploying is no longer a side effect of merging.
#
# This job used to run on every push to main: it SSHed to production, ran
# `git pull origin main`, rebuilt every container and then ran `db:migrate`,
# with no approval gate, no GitHub environment and no branch protection.
#
# Consequences it produced:
#   * merging Phase 1 alone would have DEPLOYED Phase 1 alone, silently
#     rewriting stored close_date values with no evidence columns to explain
#     them (see docs/gov-phase2/RELEASE-HANDOFF.md section 3);
#   * the Phase 2 migration would have applied unattended, with no verified
#     backup, no drained ingestion and no fresh baseline counts;
#   * its smoke check curled /api/v1/health, which returns 200
#     unconditionally and cannot detect an unready service;
#   * script_stop was unset, so a failed `git pull` on a divergent checkout
#     did not stop the script -- it rebuilt from the unchanged tree and
#     printed "Deploy successful".
#
# Releasing is now explicit and separate:
#   .github/workflows/release.yml  - manual deploy, preflight-gated, readiness-checked
#   .github/workflows/migrate.yml  - manual migration, separately authorized
