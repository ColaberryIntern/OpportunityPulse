name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test
  JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
  JWT_ACCESS_EXPIRY: 15m
  BCRYPT_ROUNDS: 10
  FRONTEND_URL: http://localhost:3002
  RATE_LIMIT_WINDOW_MS: 900000
  RATE_LIMIT_MAX_REQUESTS: 1000
  AUTH_RATE_LIMIT_MAX: 1000
  LOG_LEVEL: error
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

jobs:
  # Stage 1: Lint
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

  # Stage 2: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          ! grep -rn "password\s*=\s*['\"]" backend/src/ frontend/src/ --include="*.js" --include="*.jsx" || echo "Warning: potential hardcoded secrets found"

  # Stage 3: Governance checks
  governance:
    name: Governance Checks
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate environment config
        run: node execution/scripts/validate_env.js
        env:
          NODE_ENV: test
          PORT: 3001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opportunity_pulse_test
          DB_USER: opportunity_pulse
          DB_PASSWORD: ci_password
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
          BCRYPT_ROUNDS: 10

      - name: Run security scan
        run: node execution/scripts/validate_security.js

  # Stage 4: Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npx jest tests/unit --coverage --forceExit
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opportunity_pulse_test
          DB_USER: opportunity_pulse
          DB_PASSWORD: ci_password

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: backend/coverage/

  # Stage 5: Frontend tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # Stage 6: Integration tests (requires PostgreSQL)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: opportunity_pulse_test
          POSTGRES_USER: opportunity_pulse
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run integration tests
        working-directory: backend
        run: npx jest tests/integration --runInBand --forceExit
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opportunity_pulse_test
          DB_USER: opportunity_pulse
          DB_PASSWORD: ci_password

  # Stage 7: E2E tests (requires PostgreSQL)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: opportunity_pulse_test
          POSTGRES_USER: opportunity_pulse
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run E2E tests
        working-directory: backend
        run: npx jest tests/e2e --runInBand --forceExit
        env:
          PORT: 3090
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opportunity_pulse_test
          DB_USER: opportunity_pulse
          DB_PASSWORD: ci_password

  # Stage 8: Docker build verification
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [e2e-tests, governance]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t op-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t op-frontend:ci ./frontend

      - name: Verify images exist
        run: |
          docker image inspect op-backend:ci > /dev/null 2>&1
          docker image inspect op-frontend:ci > /dev/null 2>&1
          echo "Both images built successfully"

  # Stage 9: Deploy to production (only on push to main)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/opportunity-pulse' }}
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            sleep 25
            curl -sf http://127.0.0.1/api/v1/health || curl -sf http://localhost:3001/api/v1/health || exit 1
            echo "Deploy successful at $(date)"
