version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: op-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: op-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build: ./backend
    container_name: op-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      BCRYPT_ROUNDS: "12"
      FRONTEND_URL: http://${DOMAIN}
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX_REQUESTS: "500"
      AUTH_RATE_LIMIT_MAX: "50"
      LOG_LEVEL: info
      AUDIT_LOG_ENABLED: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SAM_GOV_API_KEY: ${SAM_GOV_API_KEY}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@opportunitypulse.com}
      EMAIL_VERIFICATION_URL: http://${DOMAIN}/verify-email
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      REDIS_URL: redis://redis:6379
      USAJOBS_API_KEY: ${USAJOBS_API_KEY}
      USAJOBS_EMAIL: ${USAJOBS_EMAIL}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3002}
      BONFIRE_ENGINE_ENABLED: ${BONFIRE_ENGINE_ENABLED:-false}
      # Bonfire scraper — defaults are safe (off). Set the credentials and flip
      # both _ENABLED + _CRON_ENABLED in the host /opt/opportunity-pulse/.env to turn on.
      BONFIRE_SCRAPER_ENABLED: ${BONFIRE_SCRAPER_ENABLED:-false}
      BONFIRE_SCRAPER_CRON_ENABLED: ${BONFIRE_SCRAPER_CRON_ENABLED:-false}
      BONFIRE_SCRAPER_CRON: ${BONFIRE_SCRAPER_CRON:-0 7 * * *}
      BONFIRE_SCRAPER_HEADLESS: ${BONFIRE_SCRAPER_HEADLESS:-true}
      BONFIRE_SCRAPER_USERNAME: ${BONFIRE_SCRAPER_USERNAME:-}
      BONFIRE_SCRAPER_PASSWORD: ${BONFIRE_SCRAPER_PASSWORD:-}
      # Multi-account JSON; falls back to USERNAME/PASSWORD above when empty.
      # Example: [{"label":"que","username":"u1","password":"p1"},{"label":"colaberry","username":"u2","password":"p2"}]
      BONFIRE_SCRAPER_ACCOUNTS: ${BONFIRE_SCRAPER_ACCOUNTS:-}
      BONFIRE_SCRAPER_PHASE: ${BONFIRE_SCRAPER_PHASE:-C}
      # Empty default = iterate the full vendor-network result (all ~92 agencies).
      # To restrict to a subset, set BONFIRE_SCRAPER_AGENCY_ALLOWLIST=sub1,sub2 in .env.prod.
      BONFIRE_SCRAPER_AGENCY_ALLOWLIST: ${BONFIRE_SCRAPER_AGENCY_ALLOWLIST:-}
      BONFIRE_SCRAPER_STORAGE_DIR: ${BONFIRE_SCRAPER_STORAGE_DIR:-/app/.bonfire-session}
      BONFIRE_SCRAPER_SESSION_TTL_MIN: ${BONFIRE_SCRAPER_SESSION_TTL_MIN:-25}
      BONFIRE_SCRAPER_PER_AGENCY_DELAY_MS: ${BONFIRE_SCRAPER_PER_AGENCY_DELAY_MS:-4000}
      BONFIRE_SCRAPER_AUTO_ENRICH: ${BONFIRE_SCRAPER_AUTO_ENRICH:-true}
      BONFIRE_SCRAPER_AGENCY_FRESHNESS_HOURS: ${BONFIRE_SCRAPER_AGENCY_FRESHNESS_HOURS:-72}
      BONFIRE_SCRAPER_SHUFFLE_AGENCIES: ${BONFIRE_SCRAPER_SHUFFLE_AGENCIES:-true}
      BONFIRE_STRATEGIST_CRON_ENABLED: ${BONFIRE_STRATEGIST_CRON_ENABLED:-false}
      BONFIRE_STRATEGIST_CRON: ${BONFIRE_STRATEGIST_CRON:-0 8 * * 1,3,5}
      OIED_DIGEST_ENABLED: ${OIED_DIGEST_ENABLED:-false}
      OIED_DIGEST_CRON: ${OIED_DIGEST_CRON:-0 8 * * *}
      OIED_DIGEST_TO: ${OIED_DIGEST_TO:-}
      # v7: External AI Bridge — empty/unset disables the API-key path
      # (JWT keeps working). Set to a 48-char hex value to enable.
      OIED_INTELLIGENCE_API_KEY: ${OIED_INTELLIGENCE_API_KEY:-}
      OIED_INTELLIGENCE_DEFAULT_ORG_ID: ${OIED_INTELLIGENCE_DEFAULT_ORG_ID:-1}
      # v9.1 UX: daily briefing + trigger-engine cron, off by default.
      OIED_BRIEFING_ENABLED: ${OIED_BRIEFING_ENABLED:-false}
      OIED_BRIEFING_CRON: ${OIED_BRIEFING_CRON:-0 7 * * *}
      OIED_BRIEFING_TO: ${OIED_BRIEFING_TO:-}
      OIED_AUTO_TRIGGERS_ENABLED: ${OIED_AUTO_TRIGGERS_ENABLED:-false}
      OIED_AUTO_TRIGGERS_CRON: ${OIED_AUTO_TRIGGERS_CRON:-0 6 * * *}
      # v9.7: keyword trends compute (twice daily). OFF by default.
      OIED_KEYWORD_TRENDS_ENABLED: ${OIED_KEYWORD_TRENDS_ENABLED:-false}
      OIED_KEYWORD_TRENDS_CRON: ${OIED_KEYWORD_TRENDS_CRON:-15 5,17 * * *}
      # v9.10: Source Health Auto-Triage Agent. Runs daily an hour after
      # the master ingestion cron, retries failing sources, emails the
      # operator a summary when there's something to report.
      OIED_SOURCE_HEALTH_AGENT_ENABLED: ${OIED_SOURCE_HEALTH_AGENT_ENABLED:-false}
      OIED_SOURCE_HEALTH_AGENT_CRON: ${OIED_SOURCE_HEALTH_AGENT_CRON:-0 7 * * *}
      OIED_SOURCE_HEALTH_AGENT_TO: ${OIED_SOURCE_HEALTH_AGENT_TO:-}
      OIED_PUBLIC_URL: ${OIED_PUBLIC_URL:-http://95.216.199.47}
      # v0.1 Submission Readiness — evergreen document vault. Files
      # persist via the named volume mounted at /app/uploads below.
      DOCUMENT_STORAGE_ROOT: ${DOCUMENT_STORAGE_ROOT:-/app/uploads/documents}
    volumes:
      - op-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE_URL: /api/v1
    container_name: op-frontend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: op-nginx
    restart: unless-stopped
    # Multi-tenant servers (running multiple stacks) can override these via
    # NGINX_HTTP_PORT / NGINX_HTTPS_PORT in .env.prod. Default 80/443 is the
    # right answer for any single-app box. Parameterizing here so the prod
    # docker-compose.prod.yml stays unmodified locally and `git pull` keeps
    # auto-fast-forwarding without merge conflicts.
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - backend
      - frontend
    networks:
      - internal

  certbot:
    image: certbot/certbot
    container_name: op-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    container_name: op-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: op-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - internal

  backup:
    image: postgres:15-alpine
    container_name: op-backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./deploy/backup/crontab:/etc/crontabs/root:ro
      - backups:/backups
    entrypoint: ["crond", "-f", "-l", "2"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  redis-data:
  certbot-webroot:
  certbot-certs:
  prometheus-data:
  grafana-data:
  backups:
  op-uploads:    # v0.1 Submission Readiness — evergreen document vault

networks:
  internal:
    driver: bridge
